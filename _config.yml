title: おかねの教科書
description: お金の知識をわかりやすく解説。節税・補助金・保険・家計管理の実践ガイド。サラリーマン・フリーランス・中小企業経営者向けに役立つお金情報を毎週更新。
baseurl: "/money-blog"
url: "https://radonasu.github.io"
permalink: /:year/:month/:day/:title/
future: false
repository: radonasu/money-blog
lang: ja

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Minima theme settings
minima:
  skin: auto
  social_links:
    - { platform: twitter, user_url: "https://twitter.com/okane_kyokasho" }

# ナビに表示するページを明示的に指定（これ以外はナビに出ない）
header_pages:
  - about.md

# Author info
author: おかねの教科書 編集部

# Feed settings
feed:
  posts_limit: 20

# SEO settings
twitter:
  username: okane_kyokasho
  card: summary

# Default layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Exclude from builds
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - "*.sh"
